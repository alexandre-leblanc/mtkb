<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    button {
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: rgba(40, 40, 40, 0.9);
      color: white;
      font: 24px Arial, sans-serif;
      line-height: 30px;
      cursor: pointer;
    }

    button:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <button id="close" aria-label="Close popup">&times;</button>

  <script>
    document.getElementById('close').addEventListener('click', () => {
      window.popupAPI.close();
    });
  </script>
</body>
</html>
