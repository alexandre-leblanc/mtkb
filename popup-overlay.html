<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .dimming {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
    }

    .popup-frame {
      position: absolute;
      inset: var(--popup-inset, 32px);
      border: 2px solid #b8b8b8;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="dimming"></div>
  <div class="popup-frame"></div>
  <script>
    const inset = Number(
      new URLSearchParams(window.location.search).get('inset')
    );

    if (Number.isFinite(inset) && inset >= 0 && inset <= 1000) {
      document.documentElement.style.setProperty(
        '--popup-inset',
        `${inset}px`
      );
    }
  </script>
</body>
</html>
